name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # manual run → all browsers, including mobile emulation

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Default run: Chromium + API  → install only Chromium (faster)
      - name: Install Playwright browsers (Chromium)
        if: github.event_name != 'workflow_dispatch'
        run: npx playwright install --with-deps chromium

      - name: Run tests (Chromium + API)
        if: github.event_name != 'workflow_dispatch'
        run: npm test

      # Manual run: Chromium, Firefox, WebKit, mobile emulation + API
      - name: Install Playwright browsers (all)
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps

      - name: Run tests (all projects)
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:all

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/
          retention-days: 30
