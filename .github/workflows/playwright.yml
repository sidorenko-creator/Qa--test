name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # ручной запуск из вкладки Actions → все браузеры и мобильная эмуляция

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      # Обычный запуск (push / pull request): Chromium + API + unit → ставим только Chromium, это быстрее
      - name: Установка браузера (Chromium)
        if: github.event_name != 'workflow_dispatch'
        run: npx playwright install --with-deps chromium

      - name: Запуск тестов (Chromium + API + unit)
        if: github.event_name != 'workflow_dispatch'
        run: npm test

      # Ручной запуск: все браузеры (smoke) + мобильные + API + unit
      - name: Установка всех браузеров
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps

      - name: Запуск тестов (все проекты)
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:all

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/
          retention-days: 30
